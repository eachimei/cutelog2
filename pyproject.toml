[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cutelog2"
version = "1.0.0"
description = "GUI for Python's logging module (PyQt6/PySide6 fork of cutelog)"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Fork of cutelog, originally written by Alexander Bus. See LICENSE and the README
# for attribution; upstream is not involved in this package and shouldn't receive
# its bug reports.
authors = [{ name = "eachimei" }]
keywords = ["log", "logging", "gui", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X :: Cocoa",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "qtpy>=2.4",
    # On Linux the distro-supplied Qt package is preferred over the PyPI wheel.
    'PyQt6>=6.4; platform_system != "Linux"',
    "jsonstream==0.0.1",
]

[project.optional-dependencies]
msgpack = ["msgpack"]
cbor = ["cbor2"]
color = ["colorlog"]
test = ["pytest>=8", "pytest-qt>=4.4", "pytest-cov"]
dev = ["cutelog2[test]", "ruff>=0.6", "build"]

[project.urls]
Homepage = "https://github.com/eachimei/cutelog/"
Source = "https://github.com/eachimei/cutelog/"
Issues = "https://github.com/eachimei/cutelog/issues"

[project.gui-scripts]
cutelog2 = "cutelog2.__main__:main"

[tool.setuptools]
packages = ["cutelog2"]

[tool.setuptools.package-data]
cutelog2 = [
    "resources/*.qss",
    "resources/ui/*.ui",
    "resources/icons/*/*.svg",
    "resources/images/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["cutelog2", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"cutelog2/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["cutelog2"]
