[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cutelog2"
version = "1.1.1"
description = "GUI for Python's logging module (PyQt6/PySide6 fork of cutelog)"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Fork of cutelog, originally written by Alexander Bus. See LICENSE and the README
# for attribution; upstream is not involved in this package and shouldn't receive
# its bug reports.
authors = [{ name = "Eyal Achimeir" }]
keywords = ["log", "logging", "gui", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X :: Cocoa",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "qtpy>=2.4",
    # PySide6-Essentials covers everything this app uses (QtCore/Gui/Widgets/Network/
    # UiTools); the full PySide6 wheel also pulls in PySide6-Addons (WebEngine, Qt3D,
    # Charts, ...), which roughly triples the install size for modules cutelog2 never
    # imports. LGPLv3, so it imposes no licence obligation on users of this MIT app.
    # On Linux the distro-supplied Qt package is preferred over the PyPI wheel.
    'PySide6-Essentials>=6.4; platform_system != "Linux"',
    "jsonstream==0.0.1",
]

[project.optional-dependencies]
# PyQt6 is fully supported and covered by CI; it is GPLv3, hence not the default.
pyqt6 = ["PyQt6>=6.4"]
msgpack = ["msgpack"]
cbor = ["cbor2"]
color = ["colorlog"]
test = ["pytest>=8", "pytest-qt>=4.4", "pytest-cov"]
dev = ["cutelog2[test]", "ruff>=0.6", "build"]

[project.urls]
Homepage = "https://github.com/eachimei/cutelog2/"
Source = "https://github.com/eachimei/cutelog2/"
Issues = "https://github.com/eachimei/cutelog2/issues"

[project.gui-scripts]
cutelog2 = "cutelog2.__main__:main"

[tool.setuptools]
packages = ["cutelog2"]

[tool.setuptools.package-data]
cutelog2 = [
    "resources/*.qss",
    "resources/ui/*.ui",
    "resources/icons/*/*.svg",
    "resources/images/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Qt reports object-lifetime and threading errors through its own message handler, not as
# Python exceptions, so they would otherwise scroll past a passing run. These are exactly
# the failures that differ between PyQt6 and PySide6.
qt_log_level_fail = "WARNING"
qt_log_ignore = [
    "^QStandardPaths: XDG_RUNTIME_DIR",
    "^Wayland does not support",
    # Qt stopped shipping fonts; the wheels have no font directory to find.
    "^QFontDatabase: Cannot find font directory",
    # Limitation of the offscreen platform plugin, not of the application.
    "^This plugin does not support propagateSizeHints",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["cutelog2", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"cutelog2/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["cutelog2"]
