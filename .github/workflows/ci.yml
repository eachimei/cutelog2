name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # `package` is what actually ships: PySide6-Essentials, not the full PySide6
        # meta-package, since cutelog2 never touches anything in PySide6-Addons.
        qt: [{api: PyQt6, package: PyQt6}, {api: PySide6, package: PySide6-Essentials}]
        os: [ubuntu-latest]
        include:
          - os: windows-latest
            python-version: "3.13"
            qt: {api: PySide6, package: PySide6-Essentials}
          - os: windows-latest
            python-version: "3.13"
            qt: {api: PyQt6, package: PyQt6}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: ${{ matrix.qt.api }}
      PYTEST_QT_API: ${{ matrix.qt.api }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3
      - run: pip install -e ".[test,msgpack,cbor]" ${{ matrix.qt.package }}
      - run: pytest -ra

  # The offscreen platform does no real window management, so widget reparenting and
  # window flags (tab pop-out) are not meaningfully exercised there.
  test-xvfb:
    strategy:
      fail-fast: false
      matrix:
        qt: [{api: PyQt6, package: PyQt6}, {api: PySide6, package: PySide6-Essentials}]
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: xcb
      QT_API: ${{ matrix.qt.api }}
      PYTEST_QT_API: ${{ matrix.qt.api }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3
      - run: pip install -e ".[test,msgpack,cbor]" ${{ matrix.qt.package }}
      - run: xvfb-run -a pytest -ra

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Verify package data is present in the wheel
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              'cutelog2/resources/dark_theme.qss',
              'cutelog2/resources/light_theme.qss',
              'cutelog2/resources/ui/logger.ui',
              'cutelog2/resources/images/cutelog.png',
              'cutelog2/resources/icons/dark_theme/ion-check.svg',
          ]
          missing = [n for n in required if n not in names]
          assert not missing, f'missing from wheel: {missing}'
          print(f'{wheel}: all resources present')
          EOF
